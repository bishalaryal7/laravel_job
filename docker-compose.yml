services:
  mysql:
    image: mariadb:10.8.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laravel_job
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    ports:
      - "3301:3306"   # Use a free port

  adminer:
    image: adminer
    restart: always
    ports:
      - "8000:8080"
